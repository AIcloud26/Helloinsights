    .hero-intro{max-width:820px;margin:0 auto 0.8rem;padding:0 1rem;text-align:left;color:#444;line-height:1.7;font-size:0.95rem;}
    .hero-intro p{margin-bottom:0.7rem;}
    .hero-intro p:last-child{margin-bottom:0;}

    .hero-compact{max-width:820px;margin:0 auto;padding:0 1rem;}
    .hero-compact .hero-cta{display:inline-block;margin-top:0.5rem;padding:8px 22px;background:#ff6b35;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s;}

    .hero-compact .featured-tags a{display:inline-block;margin-right:8px;margin-bottom:4px;padding:4px 14px;background:#fff5f0;color:#ff6b35;border:1px solid #ffd4c0;border-radius:20px;font-size:.82rem;font-weight:600;text-decoration:none;transition:background .2s,color .2s;}
    .hero-compact .featured-tags a:hover{background:#ff6b35;color:#fff;}
    /* ===== Featured Insights Section ===== */
    .featured-section{max-width:820px;margin:0 auto 2rem;padding:0 1rem;}
    .featured-section h2{font-size:1.4rem;font-weight:700;color:#1a1a1a;margin-bottom:1rem;}
    .featured-card{display:block;padding:1.1rem 1.4rem;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:0.85rem;text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s;}
    .featured-card:hover{border-color:#ff6b35;box-shadow:0 2px 12px rgba(255,107,53,.10);}
    .featured-card-title{font-size:1.15rem;font-weight:700;color:#1a1a1a;margin:0 0 .35rem;line-height:1.35;}
    .featured-card-meta{font-size:.85rem;color:#888;margin-bottom:.45rem;}
    .featured-card-meta .cat{color:#ff6b35;font-weight:600;}
    .featured-card-excerpt{font-size:.91rem;color:#555;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;}
    /* ===== Latest Insights Section (Bottom) ===== */
    .latest-section{max-width:820px;margin:0 auto 3rem;padding:0 1rem;}
    .latest-section h2{font-size:1.5rem;font-weight:700;color:#1a1a1a;margin-bottom:1.25rem;}
    .latest-card{display:block;padding:1.1rem 1.4rem;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:0.85rem;text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s;}
    .latest-card:hover{border-color:#ff6b35;box-shadow:0 2px 12px rgba(255,107,53,.10);}
    .latest-card-title{font-size:1.15rem;font-weight:700;color:#1a1a1a;margin:0 0 .35rem;line-height:1.35;}
    .latest-card-meta{font-size:.85rem;color:#888;margin-bottom:.45rem;}
    .latest-card-meta .cat{color:#ff6b35;font-weight:600;}
    .latest-card-excerpt{font-size:.91rem;color:#555;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;}
    .read-more-btn-inline{display:inline-block;margin-top:.8rem;padding:8px 24px;background:#ff6b35;color:#fff;border:none;border-radius:8px;font-size:.91rem;font-weight:600;cursor:pointer;transition:background .2s;}

    @media(max-width:768px){

        .page-header .site-tagline{font-size:.78rem!important;}
        .hero-intro{margin-bottom:0.6rem!important;}
        .hero-intro p{font-size:0.85rem!important;line-height:1.5!important;margin-bottom:0.5rem!important;}

        .latest-card-excerpt{font-size:0.84rem!important;line-height:1.45!important;}

    .ad-slot{margin:1.2rem auto;text-align:center;min-height:250px;display:flex;align-items:center;justify-content:center;}

    .inline-ad-banner{grid-column:1/-1;margin:0.5rem 0;}

    var isSearching = false;
    var searchQuery = '';
    var categoryNames = IS_MAIN_DOMAIN ? ALL_CATEGORY_NAMES : {};
    if (!IS_MAIN_DOMAIN) categoryNames[CAT_ID] = CFG.name;
    var fallbackImages = IS_MAIN_DOMAIN ? ALL_FALLBACK_IMAGES : {};
    if (!IS_MAIN_DOMAIN) fallbackImages[CAT_ID] = CFG.fallbackImage;
    var defaultFallback = IS_MAIN_DOMAIN ? ALL_FALLBACK_IMAGES['finance'] : CFG.fallbackImage;
    var allArticlesCache = [];
    var latestExpanded = false;
    var featuredExpanded = false;
    var featuredArticles = [];
    var latestArticles = [];

    // Build article URL (main domain links to subdomain article page)
    function getArticleUrl(article) {
        if (IS_MAIN_DOMAIN) {
            return buildSubdomainUrl(article.category) + '/article.html?id=' + article.id;
        }
        return 'article.html?id=' + article.id;
    }

    // Format date
    function formatDate(dateStr) {
        if (!dateStr) return '';
        var parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        var d = new Date(parts[0] + '-' + parts[1] + '-' + parts[2]);
        var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }

    function getFallbackImage(cat) { return fallbackImages[cat] || defaultFallback; }

    function createArticleCard(article) {
        var catName = categoryNames[article.category] || article.category;
        var fb = getFallbackImage(article.category);
        var dateDisplay = formatDate(article.date);
        var articleUrl = getArticleUrl(article);
        return '<article class="article-card">' +
            '<div class="card-image"><img src="' + article.image + '" alt="' + article.title + '" width="600" height="400" loading="lazy" decoding="async" onerror="this.src=\'' + fb + '\'"></div>' +
            '<div class="card-content">' +
            '<span class="card-category">' + catName + '</span>' +
            '<h3 class="card-title"><a href="' + articleUrl + '">' + article.title + '</a></h3>' +
            '<p class="card-excerpt">' + article.excerpt + '</p>' +
            '<div class="card-meta"><span>' + dateDisplay + '</span></div>' +
            '<a href="' + articleUrl + '" class="read-more-btn">Read More</a>' +
            '</div></article>';
    }

    // Inline ad banner HTML
    function createInlineAdBanner(slotId) {
        return '<div class="inline-ad-banner"><div class="ad-slot" data-ad-slot="' + slotId + '"></div></div>';
    }

    function renderPagination(total) {
        var pages = Math.ceil(total / ARTICLES_PER_PAGE);
        var el = document.getElementById('pagination');
        if (!el || pages <= 1) { if (el) el.innerHTML = ''; return; }
        var h = '';
        if (currentPage > 1) h += '<a href="#" class="page-btn" onclick="changePage(' + (currentPage - 1) + ');return false;">‹</a>';
        else h += '<span class="page-btn disabled">‹</span>';
        var range = 2;
        var start = Math.max(2, currentPage - range);
        var end = Math.min(pages - 1, currentPage + range);
        if (currentPage === 1) h += '<span class="page-btn active">1</span>';
        else h += '<a href="#" class="page-btn" onclick="changePage(1);return false;">1</a>';
        if (start > 2) h += '<span class="page-btn disabled" style="cursor:default;">…</span>';
        for (var i = start; i <= end; i++) {
            if (i === currentPage) h += '<span class="page-btn active">' + i + '</span>';
            else h += '<a href="#" class="page-btn" onclick="changePage(' + i + ');return false;">' + i + '</a>';
        }
        if (end < pages - 1) h += '<span class="page-btn disabled" style="cursor:default;">…</span>';
        if (currentPage === pages) h += '<span class="page-btn active">' + pages + '</span>';
        else h += '<a href="#" class="page-btn" onclick="changePage(' + pages + ');return false;">' + pages + '</a>';
        if (currentPage < pages) h += '<a href="#" class="page-btn" onclick="changePage(' + (currentPage + 1) + ');return false;">›</a>';
        else h += '<span class="page-btn disabled">›</span>';
        el.innerHTML = h;
    }

    function changePage(p) {
        if (isSearching) {
            var t = Math.ceil(filteredArticles.length / ARTICLES_PER_PAGE);
            if (p < 1 || p > t) return;
            currentPage = p;
            renderSearchResults(filteredArticles);
        } else {
            var t2 = Math.ceil(allArticlesCache.length / ARTICLES_PER_PAGE);
            if (p < 1 || p > t2) return;
            currentPage = p;
            fetchArticlesForPage(p);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleSearch() {
        var input = document.getElementById('searchInput');
        if (!input) return;
        var q = input.value.trim();
        searchQuery = q;
        if (!q) { clearSearch(); return; }
        isSearching = true; currentPage = 1;
        var lq = q.toLowerCase();
        filteredArticles = allArticlesCache.filter(function(a) {
            var cn = categoryNames[a.category] || a.category;
            return a.title.toLowerCase().indexOf(lq) !== -1 || a.excerpt.toLowerCase().indexOf(lq) !== -1 ||
                   a.category.toLowerCase().indexOf(lq) !== -1 || cn.toLowerCase().indexOf(lq) !== -1;
        });
        var si = document.getElementById('searchInfo'), st = document.getElementById('searchText');
        if (si && st) { si.style.display = 'block'; st.textContent = 'Found ' + filteredArticles.length + ' results for "' + q + '"'; }
        renderSearchResults(filteredArticles);
    }

    function searchByTopic(topic) {
        var input = document.getElementById('searchInput');
        if (input) input.value = topic;
        handleSearch();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearSearch() {
        isSearching = false; searchQuery = ''; currentPage = 1;
        var input = document.getElementById('searchInput');
        if (input) input.value = '';
        var si = document.getElementById('searchInfo');
        if (si) si.style.display = 'none';
        fetchArticlesForPage(1);
    }

    function initSearch() {
        var input = document.getElementById('searchInput'), btn = document.getElementById('searchBtn');
        if (input) input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); handleSearch(); } });
        if (btn) btn.addEventListener('click', function(e) { e.preventDefault(); handleSearch(); });
    }

    function fetchArticlesForPage(page) {
        var start = (page - 1) * ARTICLES_PER_PAGE;
        renderPageArticles(allArticlesCache.slice(start, start + ARTICLES_PER_PAGE));
    }

    function renderPageArticles(articles) {
        var grid = document.getElementById('articleGrid');
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        if (!grid) return;
        if (articles.length === 0) {
            grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;">No articles found.</p>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        var html = '';
        for (var i = 0; i < articles.length; i++) {
            html += createArticleCard(articles[i]);
            if (i === 2) html += createInlineAdBanner('banner-mid-1');
            if (i === 5) html += createInlineAdBanner('banner-mid-2');
        }
        grid.innerHTML = html;
        renderPagination(allArticlesCache.length);
        if (window.AdConfig && typeof window.AdConfig.renderAll === 'function') {
            window.AdConfig.renderAll();
        }
    }

    function renderSearchResults(articles) {
        var grid = document.getElementById('articleGrid');
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        if (!grid) return;
        if (articles.length === 0) {
            grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;color:#666;">No articles found for "' + searchQuery + '".</p>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        var start = (currentPage - 1) * ARTICLES_PER_PAGE;
        var page = articles.slice(start, start + ARTICLES_PER_PAGE);
        var html = '';
        for (var i = 0; i < page.length; i++) {
            html += createArticleCard(page[i]);
            if (i === 2) html += createInlineAdBanner('banner-mid-1');
            if (i === 5) html += createInlineAdBanner('banner-mid-2');
        }
        grid.innerHTML = html;
        renderPagination(articles.length);
        if (window.AdConfig && typeof window.AdConfig.renderAll === 'function') {
            window.AdConfig.renderAll();
        }
    }

    // ===== Featured Insights (3 + Read More) =====
    function renderFeaturedInsights(articles) {
        featuredArticles = articles;
        var section = document.getElementById('featuredSection');
        var container = document.getElementById('featuredCards');
        var readMoreWrap = document.getElementById('featuredReadMoreWrap');
        if (!container || !section || articles.length === 0) { if (section) section.style.display = 'none'; return; }
        section.style.display = 'block';
        var showCount = featuredExpanded ? Math.min(articles.length, 12) : Math.min(3, articles.length);
        var html = '';
        for (var i = 0; i < showCount; i++) {
            var a = articles[i];
            var catName = categoryNames[a.category] || a.category;
            var articleUrl = getArticleUrl(a);
            html += '<a class="featured-card" href="' + articleUrl + '">' +
                '<p class="featured-card-title">' + a.title + '</p>' +
                '<p class="featured-card-meta"><span class="cat">' + catName + '</span> · ' + formatDate(a.date) + '</p>' +
                '<p class="featured-card-excerpt">' + a.excerpt + '</p>' +
                '</a>';
        }
        container.innerHTML = html;
        if (readMoreWrap) {
            if (!featuredExpanded && articles.length > 3) {
                readMoreWrap.style.display = 'block';
            } else {
                readMoreWrap.style.display = 'none';
            }
        }
    }
    function expandFeatured() {
        featuredExpanded = true;
        renderFeaturedInsights(featuredArticles);
    }

    // ===== Latest Insights (bottom, 3 + Read More) =====
    function renderLatestInsights(articles) {
        latestArticles = articles;
        var container = document.getElementById('latestCards');
        var section = document.getElementById('latestSection');
        var readMoreWrap = document.getElementById('latestReadMoreWrap');
        if (!container || !section || articles.length === 0) { if (section) section.style.display = 'none'; return; }
        var showCount = latestExpanded ? Math.min(articles.length, 12) : Math.min(3, articles.length);
        var html = '';
        for (var i = 0; i < showCount; i++) {
            var a = articles[i];
            var catName = categoryNames[a.category] || a.category;
            var articleUrl = getArticleUrl(a);
            html += '<a class="latest-card" href="' + articleUrl + '">' +
                '<p class="latest-card-title">' + a.title + '</p>' +
                '<p class="latest-card-meta"><span class="cat">' + catName + '</span> · ' + formatDate(a.date) + '</p>' +
                '<p class="latest-card-excerpt">' + a.excerpt + '</p>' +
                '</a>';
        }
        container.innerHTML = html;
        if (readMoreWrap) {
            if (!latestExpanded && articles.length > 3) {
                readMoreWrap.style.display = 'block';
            } else {
                readMoreWrap.style.display = 'none';
            }
        }
    }
    function expandLatestInsights() {
        latestExpanded = true;
        renderLatestInsights(latestArticles);
    }

    // ===== Load Articles =====
    function initApp(allArticles) {
        allArticlesCache = allArticles;
        allArticlesCache.sort(function(a, b) {
            return (b.date || '').localeCompare(a.date || '');
        });
        // Featured: articles with featured=true, or fallback to first 3
        var featured = allArticlesCache.filter(function(a) { return a.featured === true; });
        if (featured.length === 0) {
            featured = allArticlesCache.slice(0, 3);
        }
        // Latest: top articles by date, excluding featured ones
        var featuredIds = {};
        for (var f = 0; f < featured.length; f++) featuredIds[featured[f].id] = true;
        var latest = allArticlesCache.filter(function(a) { return !featuredIds[a.id]; }).slice(0, 12);
        renderFeaturedInsights(featured);
        renderLatestInsights(latest);
        fetchArticlesForPage(1);
        initSearch();
    }

    if (IS_MAIN_DOMAIN) {
        // Main domain: load all 4 category JSONs in parallel, merge and sort
        var jsonFiles = [
            'articles-finance.json',
            'articles-technology.json',
            'articles-ai-tools.json',
            'articles-health-lifestyle.json'
        ];
        var loadedCount = 0;
        var mergedArticles = [];
        var loadErrors = [];
        for (var j = 0; j < jsonFiles.length; j++) {
            (function(file) {
                fetch(file)
                    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(function(data) {
                        var arts = data.articles || [];
                        for (var k = 0; k < arts.length; k++) {
                            mergedArticles.push(arts[k]);
                        }
                        loadedCount++;
                        if (loadedCount === jsonFiles.length) {
                            initApp(mergedArticles);
                        }
                    })
                    .catch(function(err) {
                        loadErrors.push(file + ': ' + err.message);
                        loadedCount++;
                        if (loadedCount === jsonFiles.length) {
                            if (mergedArticles.length > 0) {
                                console.warn('Partial load errors:', loadErrors);
                                initApp(mergedArticles);
                            } else {
                                var grid = document.getElementById('articleGrid');
                                if (grid) grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;color:#999;">Unable to load articles: ' + loadErrors.join('; ') + '</p>';
                            }
                        }
                    });
            })(jsonFiles[j]);
        }
    } else {
        // Subdomain: load single category JSON
        fetch(CFG.jsonFile)
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(data) {
                initApp(data.articles || []);
            })
            .catch(function(err) {
                console.error('Load error:', err.message);
                var grid = document.getElementById('articleGrid');
                if (grid) grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;color:#999;">Unable to load articles: ' + err.message + '</p>';
            });
    }

    // Config loader integration
    if (typeof loadSiteConfig === 'function') {
        loadSiteConfig(function(config) {
            if (config && config.categories) {
                for (var i = 0; i < config.categories.length; i++) {
                    var catId = config.categories[i].id;
                    if (categoryNames[catId] !== undefined) {
                        categoryNames[catId] = config.categories[i].name;
                    }
                }
            }
        });
    }
    </script>
</body>
</html>
